name: Twirl
description: >-
  Twirl is a data platform and orchestrator that lets teams build data products
  faster by combining BigQuery, dbt, Python, and Google Cloud services (GCS,
  Dataflow) in a single git-backed project. Backed by Creandum. As of July 2026
  the twirldata.com website and docs.twirldata.com both return 404 (GitHub
  Pages) and no public API surface is available; the remaining public artifacts
  are the twirldata GitHub org (twirl-examples) and a placeholder PyPI package
  (twirldata 0.0.0, "Client SDK for the Twirl data platform").
